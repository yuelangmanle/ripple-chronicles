
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def signingPropertiesFile = System.getenv("RIPPLE_SIGNING_PROPERTIES")
        ? file(System.getenv("RIPPLE_SIGNING_PROPERTIES"))
        : rootProject.file("../tupian-signing/signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingStorePath = signingProperties.getProperty("storeFile")
def signingStoreFile = signingStorePath ? file(signingStorePath) : null
def persistedSigningReady = signingStoreFile?.isFile()
def optionalConfig = { String key ->
    (project.findProperty(key) ?: System.getenv(key) ?: "").toString()
}
def quoteBuildConfig = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
def supabaseUrl = optionalConfig("SUPABASE_URL")
def supabaseAnonKey = optionalConfig("SUPABASE_ANON_KEY")

android {
    namespace 'com.dlovel.plankton'
    compileSdk 34

    defaultConfig {
        applicationId "com.dlovel"
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName "1.7.4"

        buildConfigField "String", "SUPABASE_URL", quoteBuildConfig(supabaseUrl)
        buildConfigField "String", "SUPABASE_ANON_KEY", quoteBuildConfig(supabaseAnonKey)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (persistedSigningReady) {
            persisted {
                storeFile signingStoreFile
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            if (persistedSigningReady) {
                signingConfig signingConfigs.persisted
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (persistedSigningReady) {
                signingConfig signingConfigs.persisted
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

def archiveDir = rootProject.file("archives/apk")
def apkPath = "$buildDir/outputs/apk/debug/app-debug.apk"
def releaseApkPath = "$buildDir/outputs/apk/release/app-release.apk"
tasks.register("archiveDebugApk", Copy) {
    onlyIf { file(apkPath).exists() }
    from(apkPath)
    into(archiveDir)
    doFirst {
        archiveDir.mkdirs()
    }
    rename { fileName ->
        def stamp = new Date().format("yyyyMMdd_HHmmss")
        def vName = android.defaultConfig.versionName
        def vCode = android.defaultConfig.versionCode
        "ripple-chronicles-debug-v${vName}-${vCode}-${stamp}.apk"
    }
}
afterEvaluate {
    tasks.matching { it.name == "assembleDebug" }.configureEach {
        finalizedBy("archiveDebugApk")
    }
}

tasks.register("archiveReleaseApk", Copy) {
    onlyIf { file(releaseApkPath).exists() }
    from(releaseApkPath)
    into(archiveDir)
    doFirst {
        archiveDir.mkdirs()
    }
    rename { fileName ->
        def vName = android.defaultConfig.versionName
        def vCode = android.defaultConfig.versionCode
        "ripple-chronicles-release-v${vName}-${vCode}.apk"
    }
}
afterEvaluate {
    tasks.matching { it.name == "assembleRelease" }.configureEach {
        finalizedBy("archiveReleaseApk")
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.5'

    // Supabase
    implementation "io.github.jan-tennert.supabase:postgrest-kt:1.4.7"
    implementation "io.github.jan-tennert.supabase:storage-kt:1.4.7"
    implementation "io.github.jan-tennert.supabase:gotrue-kt:1.4.7"
    implementation "io.ktor:ktor-client-android:2.3.6"

    // Image Loading
    implementation "io.coil-kt:coil-compose:2.5.0"
    implementation "me.saket.telephoto:zoomable-image-coil:0.7.1"

    // Word Export
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    def camerax_version = "1.3.2"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-extensions:$camerax_version"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
