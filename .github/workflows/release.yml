name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/ripple-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ripple-signing/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/ripple-signing/release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > "$RUNNER_TEMP/ripple-signing/signing.properties"
      - name: Build signed release
        env:
          RIPPLE_SIGNING_PROPERTIES: ${{ runner.temp }}/ripple-signing/signing.properties
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify version, documents, package and signing certificate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_APK: app/build/outputs/apk/release/app-release.apk
          EXPECTED_CERT_SHA256: 0396dd6f055a148d00013f3e227e8bc35d857bd668a2f75486e0fa7a3f58aa16
        run: |
          node scripts/check_release_consistency.cjs
          apksigner verify --verbose --print-certs "$RELEASE_APK"
          ACTUAL_CERT_SHA256=$(apksigner verify --print-certs "$RELEASE_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2)}')
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
      - name: Create checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release.apk.sha256 --generate-notes
